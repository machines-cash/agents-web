name: CI

on:
  pull_request:
    branches:
      - contrib

permissions:
  contents: read

jobs:
  changed-files-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enforce contributor file policy
        run: node scripts/check-contrib-changes.mjs

  lint-test-build:
    runs-on: ubuntu-latest
    needs:
      - changed-files-policy
    outputs:
      docs_only: ${{ steps.change-scope.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change set
        id: change-scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            RANGE="HEAD~1...HEAD"
          fi

          changed="$(git diff --name-only "$RANGE" || true)"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          docs_only=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              README.md|CONTRIBUTING.md|SECURITY.md|LICENSE|.env.example|UI_AGENT_CONTEXT.md|.oss-contrib-allowlist|.github/workflows/ci.yml)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done <<< "$changed"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.change-scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.change-scope.outputs.docs_only != 'true'
        run: npm ci

      - name: Lint
        if: steps.change-scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Test
        if: steps.change-scope.outputs.docs_only != 'true'
        run: npm run test

      - name: Build
        if: steps.change-scope.outputs.docs_only != 'true'
        run: npm run build

      - name: Docs-only fast pass
        if: steps.change-scope.outputs.docs_only == 'true'
        run: echo "docs-only change detected; skipping lint/test/build"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (OSS)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.24.2"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks version

      - name: Gitleaks scan
        shell: bash
        run: |
          set -euo pipefail
          /tmp/gitleaks git --redact --no-banner --verbose

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
